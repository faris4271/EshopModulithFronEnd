@if (isVisible) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6">
    <div class="absolute inset-0 bg-gray-900/50 backdrop-blur-sm transition-opacity" (click)="onCancel()"></div>
    
    <div class="relative bg-white rounded-2xl shadow-xl max-w-md w-full overflow-hidden transform transition-all animate-in fade-in zoom-in duration-200">
      <div class="p-6 sm:p-8">
        <div class="flex items-start gap-4">
          <div class="w-12 h-12 rounded-full bg-red-50 flex items-center justify-center shrink-0 text-red-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 15c-.77 1.333.192 3 1.732 3z" />
            </svg>
          </div>
          <div>
            <h3 class="text-xl font-semibold text-gray-900">{{ title }}</h3>
            <p class="text-sm text-gray-500 mt-2">
              {{ message }}
            </p>
          </div>
        </div>
      </div>

      <div class="bg-gray-50 px-6 py-4 flex items-center justify-end gap-3">
        <button 
          (click)="onCancel()"
          class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-200 rounded-xl hover:bg-gray-50 active:scale-95 transition-all duration-150"
        >
          {{ cancelText }}
        </button>
        <button 
          (click)="onConfirm()"
          class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-xl hover:bg-red-700 active:scale-95 transition-all duration-150 shadow-sm shadow-red-100"
        >
          {{ confirmText }}
        </button>
      </div>
    </div>
  </div>
}
