<div class="space-y-6 max-w-3xl mx-auto p-4 sm:p-6 lg:p-8">
  <div class="flex items-center gap-4 mb-8">
    <button 
      (click)="onCancel()"
      class="p-2 rounded-xl text-gray-400 hover:text-gray-600 hover:bg-gray-100 active:scale-95 transition-all duration-150"
      title="Go back"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
    </button>
    <div>
      <h1 class="text-2xl font-semibold tracking-tight text-gray-900 sm:text-3xl">Edit Attribute Group</h1>
      <p class="text-sm text-gray-500 mt-1">Update the details of your attribute group.</p>
    </div>
  </div>

  @if (isLoading()) {
    <div class="flex flex-col items-center justify-center py-12 space-y-4">
      <div class="w-10 h-10 border-4 border-indigo-600/20 border-t-indigo-600 rounded-full animate-spin"></div>
      <p class="text-sm font-medium text-gray-500">Loading attribute group data...</p>
    </div>
  } @else if (errorMessage()) {
    <div class="bg-red-50 border border-red-100 rounded-2xl p-4 flex items-start gap-3 text-red-700">
      <svg class="w-5 h-5 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <div>
        <p class="text-sm font-semibold">Error</p>
        <p class="text-sm opacity-90">{{ errorMessage() }}</p>
      </div>
    </div>
  } @else {
    <form [formGroup]="groupForm" (ngSubmit)="onSave()" class="space-y-6">
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 sm:p-8 space-y-6">
        
        <div class="space-y-2">
          <label for="name" class="block text-sm font-medium text-gray-700">Group Name</label>
          <input 
            id="name" 
            formControlName="name"
            type="text" 
            placeholder="e.g. Technical Specifications"
            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none placeholder:text-gray-400"
          />
          @if (groupForm.get('name')?.invalid && groupForm.get('name')?.touched) {
            <p class="text-xs text-red-500 mt-1">Name is required</p>
          }
        </div>
      </div>

      <div class="flex items-center justify-end gap-3 pt-2">
        <button 
          type="button" 
          (click)="onCancel()"
          class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-200 rounded-xl hover:bg-gray-50 active:scale-95 transition-all duration-150"
        >
          Cancel
        </button>
        <button 
          type="submit" 
          [disabled]="groupForm.invalid || isLoading()"
          class="px-5 py-2.5 text-sm font-medium text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 active:scale-95 disabled:opacity-50 disabled:pointer-events-none transition-all duration-150 shadow-sm shadow-indigo-100"
        >
          @if (isLoading()) {
            Saving...
          } @else {
            Save Changes
          }
        </button>
      </div>
    </form>
  }
</div>
